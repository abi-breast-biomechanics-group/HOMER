name: paper

on:
  push:
    paths:
      - paper/**
      - .github/workflows/draft-pdf.yml
  pull_request:
    paths:
      - paper/**
      - .github/workflows/draft-pdf.yml

jobs:
  paper:
    name: draft pdf
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Open Journals' own container, so what builds here is what the editors
      # and the review bot build from the same paper.md.
      - uses: openjournals/openjournals-draft-action@master
        with:
          journal: joss
          paper-path: paper/paper.md

      # The action writes paper.pdf next to paper.md; it is never committed.
      - uses: actions/upload-artifact@v7
        with:
          name: paper
          path: paper/paper.pdf
