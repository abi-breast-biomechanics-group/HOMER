[project]
name = "HOMER"
version = "0.99.0"
requires-python = ">=3.11"
dependencies = [
    "jax",
    "scipy",
    "numpy",
    "pyvista",
    "sparsejac",
    "tqdm",
    #imported at module scope by HOMER.mesher and HOMER.fitting
    "matplotlib",
    "networkx",
    #per-user cache directory for JAX's persistent compilation cache
    "platformdirs",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
    "mkdocs-autorefs>=1.0",
    #runs the examples in the docs at build time
    "markdown-exec>=1.8",
    #exports what those examples draw as an interactive vtk.js scene.  The trame
    #plotter component moved out of pyvista into its own package in 0.49, and
    #carries the trame versions it has to be matched with; without it pyvista
    #exports nothing and says nothing.  nest_asyncio2 is what lets the export
    #start trame's server outside a notebook.
    "trame-pyvista",
    "nest_asyncio2",
    #turns an exported scene into a page carrying its own viewer
    "trame-vtk",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
#`benchmarks/` holds timing scripts with no pass/fail condition; never collect them.
norecursedirs = ["benchmarks", "bin", "build", "dev", "docs", "examples", "site"]
addopts = "-ra"
filterwarnings = [
    #jax leaves numpy's floating-point error state tripped, which surfaces as
    #spurious over/underflow warnings from unrelated numpy and scipy calls
    "ignore:overflow encountered:RuntimeWarning",
    "ignore:invalid value encountered:RuntimeWarning",
    "ignore:divide by zero encountered:RuntimeWarning",
]
